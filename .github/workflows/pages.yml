# Puts the app on GitHub Pages on every push to main.
# Only the files the app needs are published; tests, scripts and the report stay in the repo.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Only changes to the app (or its tests) trigger a release. The report and docs do not.
    paths:
      - index.html
      - manifest.webmanifest
      - sw.js
      - css/**
      - js/**
      - vendor/**
      - icons/**
      - tests/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Unit tests
        run: node --test tests/*.test.js

      - name: Collect the app files
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js vendor icons _site/
          # A new cache name for every release, so installed phones pick up the new files
          # without anyone remembering to bump the version by hand.
          sed -i "s/^const VERSION = '[^']*';/const VERSION = 'seria-${GITHUB_SHA::8}';/" _site/sw.js
          grep -q "const VERSION = 'seria-${GITHUB_SHA::8}';" _site/sw.js

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
